services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastlanches
      POSTGRES_USER: fastlanches
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastlanches -d fastlanches"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fastlanches:${POSTGRES_PASSWORD}@db:5432/fastlanches
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args: {VITE_API_URL: "/api/v1"}
    depends_on: [api]
    networks: [internal]
    ports: ["5173:80"]
volumes:
  postgres_data:
networks:
  internal:

