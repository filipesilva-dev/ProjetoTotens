[project]
name = "fastlanches-api"
version = "0.1.0"
description = "Multi-tenant API for FastLanches kiosk ordering"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3", "python-jose[cryptography]>=3.3,<4", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.27,<1", "mercadopago>=2.2,<3", "redis>=5,<6", "arq>=0.26,<1"
]
[tool.ruff]
line-length = 100
target-version = "py312"
